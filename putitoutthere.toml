# Put It Out There — release orchestration config.
# Docs: https://github.com/thekevinscott/putitoutthere

[putitoutthere]
version = 1

[[package]]
name       = "curtaincall"
kind       = "pypi"
path       = "."
globs      = ["src/**", "pyproject.toml"]
build      = "hatch"
tag_format = "v{version}"
