name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_packages:
        description: 'Comma-separated name[@bump|version] list, e.g. curtaincall@minor'
        required: true

jobs:
  release:
    uses: thekevinscott/putitoutthere/.github/workflows/release.yml@v0
    permissions:
      contents: write
      id-token: write
    with:
      release_packages: ${{ inputs.release_packages }}

  # PyPI upload runs in this workflow's context because PyPI Trusted
  # Publishers can't validate OIDC tokens minted from a cross-repo reusable
  # workflow (pypi/warehouse#11096). `pypi_pending` is only 'true' when the
  # release job handed this job an upload.
  pypi-publish:
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.pypi_pending == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-sdist'
          path: dist/
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-wheel-*'
          path: dist/
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Cuts the git tag and GitHub Release only once the upload above has landed,
  # so a failed publish never leaves a tag behind.
  pypi-tag:
    needs: [release, pypi-publish]
    if: ${{ !cancelled() && needs.pypi-publish.result == 'success' }}
    uses: thekevinscott/putitoutthere/.github/workflows/pypi-tag.yml@v0
    permissions:
      contents: write
    with:
      expect: ${{ needs.release.outputs.delegated_packages }}
